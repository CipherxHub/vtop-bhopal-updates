name: Bug report
description: Something in the app isn't working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in More → Check for updates
      placeholder: e.g. 1.6
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device + Android version
      placeholder: e.g. Pixel 6, Android 14
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what happened instead. Hide personal details.
    validations:
      required: true
